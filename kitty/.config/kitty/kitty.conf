font_family      Hack Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

enable_audio_bell no

window_padding_width 5
include kitty.theme
cursor_trail 1

hide_window_decorations yes
confirm_os_window_close 1

# KEYMAPS
map ctrl+v paste_from_clipboard

map ctrl+shift+c copy_to_clipboard
map cmd+c copy_to_clipboard

# use ov as the scrollback pager
scrollback_pager ov
# keep 100mb of terminal history
scrollback_pager_history_size 100

# map cmd+f to show the scrollback pager (command search)
map ctrl+f launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/fzf --no-sort --no-mouse --exact -i

copy_on_select yes
