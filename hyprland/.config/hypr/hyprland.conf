$scrPath = $HOME/.local/share/bin # set scripts path
$dotfiles = $HOME/dotfiles/

monitor = DP-1, 3840x2160, 0x0, 1
monitor = DP-2, 3840x2160, -3840x0, 1

exec-once = $scrPath/resetxdgportal.sh # reset XDPH for screenshare
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
exec-once = dbus-update-activation-environment --systemd --all # for XDPH
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP # for XDPH
exec-once = $scrPath/polkitkdeauth.sh # authentication dialogue for GUI apps
exec-once = waybar # launch the system bar
exec-once = blueman-applet # systray app for Bluetooth
exec-once = udiskie --no-automount --smart-tray # front-end that allows to manage removable media
exec-once = nm-applet --indicator # systray app for Network/Wifi
exec-once = dunst # start notification demon
exec-once = wl-paste --type text --watch cliphist store # clipboard store text data
exec-once = wl-paste --type image --watch cliphist store # clipboard store image data
exec-once = 1password --silent # start 1password in background
exec-once = hypridle # start idle manager
exec-once = hyprctl setcursor phinger-cursors-light 30
exec-once = awww-daemon # start wallpaper daemon
exec-once = $dotfiles/scripts/wallpaper.sh # randomly change wallpaper on startup

env = PATH,$PATH:$scrPath
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = MOZ_ENABLE_WAYLAND,1
env = GDK_SCALE,1

input {
    kb_layout = us
    kb_options = ctrl:swap_lctrl_lwin  # Swap Left Ctrl and Left Win (Meta)
    repeat_delay = 200  # Delay in milliseconds
    repeat_rate = 40    # Repeats per second

    follow_mouse = 1
    natural_scroll = true
    sensitivity = 0.6
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

master {
    new_status = master
}

misc {
    vrr = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    middle_click_paste = false
}

xwayland {
    force_zero_scaling = true
}

animations {
    enabled = yes
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 2, 30, liner, once
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
    animation = specialWorkspace, 1, 5, wind, slidevert
}

general {
    gaps_in = 0
    gaps_out = 0 
    border_size = 2
    col.active_border = rgb(1e8b50) 
    layout = dwindle
    resize_on_border = true
}

group {
    col.border_active = rgba(90ceaaff) rgba(ecd3a0ff) 45deg
    col.border_inactive = rgba(1e8b50d9) rgba(50b050d9) 45deg
    col.border_locked_active = rgba(90ceaaff) rgba(ecd3a0ff) 45deg
    col.border_locked_inactive = rgba(1e8b50d9) rgba(50b050d9) 45deg
}

decoration {
    rounding = 3
    shadow:enabled = false

    blur {
        enabled = yes
        size = 4
        passes = 2
        new_optimizations = on
        ignore_opacity = on
        xray = false
    }
}

# Main modifier
$cmdKey = Super # super / meta / windows key
$optionKey = Alt

# Window/Session actions
bindd = $cmdKey+Shift, P,Color Picker , exec, hyprpicker -a # Pick color (Hex) >> clipboard# 
bind = $cmdKey, Q, exec, $scrPath/dontkillsteam.sh # close focused window
bind = $cmdKey, G, togglegroup, # toggle the window between focus and group
bind = $cmdKey+$optionKey, F, fullscreen, # toggle the window between focus and fullscreen
bind = $cmdKey+Shift, F, exec, $scrPath/windowpin.sh # toggle pin on focused window
bind = $cmdKey+Shift, Q, exec, $scrPath/logoutlaunch.sh # launch logout menu
bind = Ctrl+$optionKey, W, exec, killall waybar || (env reload_flag=1 $scrPath/wbarconfgen.sh) # toggle waybar and reload config
bind = Ctrl+$optionKey, W, exec, killall waybar || waybar # toggle waybar without reloading, this is faster
bind = $cmdKey+$optionKey, Q, exec, hyprlock # lock screen
bind = $cmdKey+$optionKey+Shift, Q, exec, hyprlock && systemctl suspend # lock then suspend system

# Rofi menus
bind = $cmdKey, Space, exec, pkill -x rofi || rofi -show drun # $scrPath/rofilaunch.sh d # launch application launcher
bind = $cmdKey, Tab, exec, pkill -x rofi || $scrPath/rofilaunch.sh w # launch window switcher
bind = $cmdKey+Shift, E, exec, pkill -x rofi || $scrPath/rofilaunch.sh f # launch file explorer

# Audio control
bindl  = , F10, exec, $scrPath/volumecontrol.sh -o m # toggle audio mute
bindel = , F11, exec, $scrPath/volumecontrol.sh -o d # decrease volume
bindel = , F12, exec, $scrPath/volumecontrol.sh -o i # increase volume
bindl  = , XF86AudioMute, exec, $scrPath/volumecontrol.sh -o m # toggle audio mute
bindl  = , XF86AudioMicMute, exec, $scrPath/volumecontrol.sh -i m # toggle microphone mute
bindel = , XF86AudioLowerVolume, exec, $scrPath/volumecontrol.sh -o d # decrease volume
bindel = , XF86AudioRaiseVolume, exec, $scrPath/volumecontrol.sh -o i # increase volume

# Media control
bindl  = , XF86AudioPlay, exec, playerctl play-pause # toggle between media play and pause
bindl  = , XF86AudioPause, exec, playerctl play-pause # toggle between media play and pause
bindl  = , XF86AudioNext, exec, playerctl next # media next
bindl  = , XF86AudioPrev, exec, playerctl previous # media previous

# Brightness control
bindel = , XF86MonBrightnessUp, exec, $scrPath/brightnesscontrol.sh i # increase brightness
bindel = , XF86MonBrightnessDown, exec, $scrPath/brightnesscontrol.sh d # decrease brightness

# Move between grouped windows
bind = $cmdKey CTRL , H, changegroupactive, b
bind = $cmdKey CTRL , L, changegroupactive, f

# Screenshot/Screencapture
bind = $cmdKey, P, exec, $scrPath/screenshot.sh s # partial screenshot capture
bind = $cmdKey+Ctrl, P, exec, $scrPath/screenshot.sh sf # partial screenshot capture (frozen screen)
bind = $cmdKey+$optionKey, P, exec, $scrPath/screenshot.sh m # monitor screenshot capture
bind = , Print, exec, $scrPath/screenshot.sh p # all monitors screenshot capture

# Custom scripts
bind = $cmdKey, slash, exec, pkill -x rofi || $scrPath/keybinds_hint.sh # launch keybinds hint

# Move window focus with Vim keys 
bind = $cmdKey+$optionKey, h, movefocus, l  # Focus left
bind = $cmdKey+$optionKey, l, movefocus, r  # Focus right
bind = $cmdKey+$optionKey, k, movefocus, u  # Focus up
bind = $cmdKey+$optionKey, j, movefocus, d  # Focus down

# Move windows with Vim keys 
bind = $cmdKey+$optionKey+CTRL, h, movewindow, l  # Move window left
bind = $cmdKey+$optionKey+CTRL, l, movewindow, r  # Move window right
bind = $cmdKey+$optionKey+CTRL, k, movewindow, u  # Move window up
bind = $cmdKey+$optionKey+CTRL, j, movewindow, d  # Move window down

# Move workspace left or right
bind = $cmdKey+Ctrl, l, workspace, r+1
bind = $cmdKey+Ctrl, h, workspace, r-1
# Toggle focused window split
bind = $cmdKey+Ctrl, J, togglesplit

# Move/Resize focused window with mouse
bindm = $cmdKey, mouse:272, movewindow
bindm = $cmdKey, mouse:273, resizewindow

# # Remove default bindings
bindn = , mouse:274, exec, wl-copy -pc

# Switch workspaces
bind = $cmdKey, 1, workspace, 1
bind = $cmdKey, 2, workspace, 2
bind = $cmdKey, 3, workspace, 3
bind = $cmdKey, 4, workspace, 4
bind = $cmdKey, 5, workspace, 5

# Resize windows with Vim Keys
binde = $cmdKey+Shift, l, resizeactive, 30 0 # 
binde = $cmdKey+Shift, h, resizeactive, -30 0
binde = $cmdKey+Shift, k, resizeactive, 0 -30
binde = $cmdKey+Shift, j, resizeactive, 0 30

# Move focused window to a workspace
bind = $cmdKey+Shift, 1, movetoworkspace, 1
bind = $cmdKey+Shift, 2, movetoworkspace, 2
bind = $cmdKey+Shift, 3, movetoworkspace, 3
bind = $cmdKey+Shift, 4, movetoworkspace, 4
bind = $cmdKey+Shift, 5, movetoworkspace, 5

# Move focused window to a workspace silently
bind = $cmdKey+$optionKey, 1, movetoworkspacesilent, 1
bind = $cmdKey+$optionKey, 2, movetoworkspacesilent, 2
bind = $cmdKey+$optionKey, 3, movetoworkspacesilent, 3
bind = $cmdKey+$optionKey, 4, movetoworkspacesilent, 4
bind = $cmdKey+$optionKey, 5, movetoworkspacesilent, 5
