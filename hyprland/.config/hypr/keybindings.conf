# See https://wiki.hyprland.org/Configuring/Keywords/
#  &  https://wiki.hyprland.org/Configuring/Binds/

# Main modifier
$cmdKey = Super # super / meta / windows key
$optionKey = Alt

# Window/Session actions
bindd = $cmdKey+Shift, P,Color Picker , exec, hyprpicker -a # Pick color (Hex) >> clipboard# 
bind = $cmdKey, Q, exec, $scrPath/dontkillsteam.sh # close focused window
bind = $cmdKey, G, togglegroup, # toggle the window between focus and group
bind = $cmdKey+$optionKey, F, fullscreen, # toggle the window between focus and fullscreen
bind = $cmdKey+Shift, F, exec, $scrPath/windowpin.sh # toggle pin on focused window
bind = $cmdKey+Shift, Q, exec, $scrPath/logoutlaunch.sh # launch logout menu
bind = Ctrl+$optionKey, W, exec, killall waybar || (env reload_flag=1 $scrPath/wbarconfgen.sh) # toggle waybar and reload config
bind = Ctrl+$optionKey, W, exec, killall waybar || waybar # toggle waybar without reloading, this is faster

# Rofi menus
bind = $cmdKey, Space, exec, pkill -x rofi || $scrPath/rofilaunch.sh d # launch application launcher
bind = $cmdKey, Tab, exec, pkill -x rofi || $scrPath/rofilaunch.sh w # launch window switcher
bind = $cmdKey+Shift, E, exec, pkill -x rofi || $scrPath/rofilaunch.sh f # launch file explorer

# Audio control
bindl  = , F10, exec, $scrPath/volumecontrol.sh -o m # toggle audio mute
bindel = , F11, exec, $scrPath/volumecontrol.sh -o d # decrease volume
bindel = , F12, exec, $scrPath/volumecontrol.sh -o i # increase volume
bindl  = , XF86AudioMute, exec, $scrPath/volumecontrol.sh -o m # toggle audio mute
bindl  = , XF86AudioMicMute, exec, $scrPath/volumecontrol.sh -i m # toggle microphone mute
bindel = , XF86AudioLowerVolume, exec, $scrPath/volumecontrol.sh -o d # decrease volume
bindel = , XF86AudioRaiseVolume, exec, $scrPath/volumecontrol.sh -o i # increase volume

# Media control
bindl  = , XF86AudioPlay, exec, playerctl play-pause # toggle between media play and pause
bindl  = , XF86AudioPause, exec, playerctl play-pause # toggle between media play and pause
bindl  = , XF86AudioNext, exec, playerctl next # media next
bindl  = , XF86AudioPrev, exec, playerctl previous # media previous

# Brightness control
bindel = , XF86MonBrightnessUp, exec, $scrPath/brightnesscontrol.sh i # increase brightness
bindel = , XF86MonBrightnessDown, exec, $scrPath/brightnesscontrol.sh d # decrease brightness

# Move between grouped windows
bind = $cmdKey CTRL , H, changegroupactive, b
bind = $cmdKey CTRL , L, changegroupactive, f

# Screenshot/Screencapture
bind = $cmdKey, P, exec, $scrPath/screenshot.sh s # partial screenshot capture
bind = $cmdKey+Ctrl, P, exec, $scrPath/screenshot.sh sf # partial screenshot capture (frozen screen)
bind = $cmdKey+$optionKey, P, exec, $scrPath/screenshot.sh m # monitor screenshot capture
bind = , Print, exec, $scrPath/screenshot.sh p # all monitors screenshot capture

# Custom scripts
bind = $cmdKey+$optionKey, G, exec, $scrPath/gamemode.sh # disable hypr effects for gamemode
bind = $cmdKey+$optionKey, Right, exec, $scrPath/swwwallpaper.sh -n # next wallpaper
bind = $cmdKey+$optionKey, Left, exec, $scrPath/swwwallpaper.sh -p # previous wallpaper
bind = $cmdKey+$optionKey, Up, exec, $scrPath/wbarconfgen.sh n # next waybar mode
bind = $cmdKey+$optionKey, Down, exec, $scrPath/wbarconfgen.sh p # previous waybar mode
bind = $cmdKey+Shift, R, exec, pkill -x rofi || $scrPath/wallbashtoggle.sh -m # launch wallbash mode select menu
bind = $cmdKey+Shift, T, exec, pkill -x rofi || $scrPath/themeselect.sh # launch theme select menu
bind = $cmdKey+Shift, A, exec, pkill -x rofi || $scrPath/rofiselect.sh # launch select menu
bind = $cmdKey+Shift, X, exec, pkill -x rofi || $scrPath/themestyle.sh # launch theme style select menu
bind = $cmdKey+Shift, W, exec, pkill -x rofi || $scrPath/swwwallselect.sh # launch wallpaper select menu
bind = $cmdKey, V, exec, pkill -x rofi || $scrPath/cliphist.sh c # launch clipboard
bind = $cmdKey+Shift, V, exec, pkill -x rofi || $scrPath/cliphist.sh # launch clipboard Manager
bind = $cmdKey, slash, exec, pkill -x rofi || $scrPath/keybinds_hint.sh c # launch keybinds hint
bind = $cmdKey+$optionKey, A, exec, pkill -x rofi || $scrPath/animations.sh # launch animations Manager

# Move window focus with Vim keys 
bind = $cmdKey+$optionKey, h, movefocus, l  # Focus left
bind = $cmdKey+$optionKey, l, movefocus, r  # Focus right
bind = $cmdKey+$optionKey, k, movefocus, u  # Focus up
bind = $cmdKey+$optionKey, j, movefocus, d  # Focus down

# Move windows with Vim keys 
bind = $cmdKey+$optionKey+CTRL, h, movewindow, l  # Move window left
bind = $cmdKey+$optionKey+CTRL, l, movewindow, r  # Move window right
bind = $cmdKey+$optionKey+CTRL, k, movewindow, u  # Move window up
bind = $cmdKey+$optionKey+CTRL, j, movewindow, d  # Move window down

# Switch workspaces
bind = $cmdKey, 1, workspace, 1
bind = $cmdKey, 2, workspace, 2
bind = $cmdKey, 3, workspace, 3
bind = $cmdKey, 4, workspace, 4
bind = $cmdKey, 5, workspace, 5

bind = $cmdKey, 6, workspace, 6
bind = $cmdKey, 7, workspace, 7
bind = $cmdKey, 8, workspace, 8
bind = $cmdKey, 9, workspace, 9
bind = $cmdKey, 0, workspace, 10

# Switch workspaces to a relative workspace
bind = $cmdKey+Ctrl, Right, workspace, r+1
bind = $cmdKey+Ctrl, Left, workspace, r-1

# Move to the first empty workspace
bind = $cmdKey+Ctrl, Down, workspace, empty 

# Resize windows
binde = $cmdKey+Shift, Right, resizeactive, 30 0
binde = $cmdKey+Shift, Left, resizeactive, -30 0
binde = $cmdKey+Shift, Up, resizeactive, 0 -30
binde = $cmdKey+Shift, Down, resizeactive, 0 30

# Move focused window to a workspace
bind = $cmdKey+Shift, 1, movetoworkspace, 1
bind = $cmdKey+Shift, 2, movetoworkspace, 2
bind = $cmdKey+Shift, 3, movetoworkspace, 3
bind = $cmdKey+Shift, 4, movetoworkspace, 4
bind = $cmdKey+Shift, 5, movetoworkspace, 5
bind = $cmdKey+Shift, 6, movetoworkspace, 6
bind = $cmdKey+Shift, 7, movetoworkspace, 7
bind = $cmdKey+Shift, 8, movetoworkspace, 8
bind = $cmdKey+Shift, 9, movetoworkspace, 9
bind = $cmdKey+Shift, 0, movetoworkspace, 10

# Move focused window to a relative workspace
bind = $cmdKey+Ctrl+$optionKey, Right, movetoworkspace, r+1
bind = $cmdKey+Ctrl+$optionKey, Left, movetoworkspace, r-1

# Move active window around current workspace with cmdKey + SHIFT + CTRL [←→↑↓]
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
binded = $cmdKey SHIFT $CONTROL, left, Move activewindow left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
binded = $cmdKey SHIFT $CONTROL, right, Move activewindow right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
binded = $cmdKey SHIFT $CONTROL, up, Move activewindow up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
binded = $cmdKey SHIFT $CONTROL, down, Move activewindow down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

# Scroll through existing workspaces
bind = $cmdKey, mouse_down, workspace, e+1
bind = $cmdKey, mouse_up, workspace, e-1

# Move/Resize focused window
bindm = $cmdKey, mouse:272, movewindow
bindm = $cmdKey, mouse:273, resizewindow
bindm = $cmdKey, Z, movewindow
bindm = $cmdKey, X, resizewindow

# Move/Switch to special workspace (scratchpad)
bind = $cmdKey+$optionKey, S, movetoworkspacesilent, special
# bind = $cmdKey, S, togglespecialworkspace,

# Toggle focused window split
bind = $cmdKey, J, togglesplit

# Move focused window to a workspace silently
bind = $cmdKey+$optionKey, 1, movetoworkspacesilent, 1
bind = $cmdKey+$optionKey, 2, movetoworkspacesilent, 2
bind = $cmdKey+$optionKey, 3, movetoworkspacesilent, 3
bind = $cmdKey+$optionKey, 4, movetoworkspacesilent, 4
bind = $cmdKey+$optionKey, 5, movetoworkspacesilent, 5
bind = $cmdKey+$optionKey, 6, movetoworkspacesilent, 6
bind = $cmdKey+$optionKey, 7, movetoworkspacesilent, 7
bind = $cmdKey+$optionKey, 8, movetoworkspacesilent, 8
bind = $cmdKey+$optionKey, 9, movetoworkspacesilent, 9
bind = $cmdKey+$optionKey, 0, movetoworkspacesilent, 10
